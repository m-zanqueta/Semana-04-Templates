{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}

{% block page_content %}
<div class="page-header" style="border-bottom: none; margin-bottom: 10px; padding-bottom: 0;">
    <h1 style="font-size: 42px; font-weight: normal; margin-bottom: 8px;">
        Hello, {% if name %}{{ name }}{% else %}Stranger{% endif %}!
    </h1>
    <p style="font-size: 16px; color: #333;">Pleased to meet you!</p>
</div>

<hr style="border-top: 1px solid #eee; margin-top: 15px; margin-bottom: 25px;">

<div class="row">
    <div class="col-md-12">
        {{ wtf.quick_form(form) }}
    </div>
</div>
{% endblock %}
